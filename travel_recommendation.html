<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        Aether Travels
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans&amp;display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="relative min-h-screen bg-black">
    <header class="fixed top-0 left-0 w-full z-30 bg-black bg-opacity-50">
        <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-3">
            <div class="flex items-center space-x-2">
                <span class="logo-font text-white text-lg select-none font-semibold italic" style="font-family: 'Montserrat', sans-serif;">
                    Aether Travels
                </span>
            </div>
            <ul class="hidden md:flex space-x-8 text-white text-sm font-semibold">
                <li>
                    <a class="hover:underline" href="#">
                        Home
                    </a>
                </li>
                <li>
                    <a class="hover:underline" href="about_us.html">
                        About Us
                    </a>
                </li>
                <li>
                    <a class="hover:underline" href="contact_us.html">
                        Contact Us
                    </a>
                </li>
            </ul>
            <ul class="hidden md:flex items-center space-x-2 bg-white rounded-none px-3 py-1 max-w-[320px] w-full z-10">
                <li class="flex-grow">
                    <input aria-label="Search input"
                        class="w-full text-[#0f4c4c] placeholder:text-[#0f4c4c] text-sm font-normal bg-transparent outline-none rounded-none px-2 py-1"
                        id="conditionInput" placeholder="Enter a destination " type="text" />
                </li>
                <li>
                    <button
                        class="flex items-center space-x-1 bg-[#0f4c4c] text-white text-sm font-semibold rounded px-3 py-1 hover:bg-[#0a3a3a] transition"
                        id="btnSearch" type="button">
                        <span>
                            Search
                        </span>
                        <i class="fas fa-search text-white text-sm">
                        </i>
                    </button>
                </li>
                <li>
                    <button
                        class="bg-[#0f4c4c] text-white text-sm font-semibold rounded px-3 py-1 hover:bg-[#0a3a3a] transition"
                        id="btnClear" type="button">
                        Clear
                    </button>
                </li>
            </ul>
        </nav>
        
    </header>
    
    <main class="pt-20">
        
        <div class="relative w-full h-[600px] md:h-[700px] lg:h-[750px] xl:h-[800px]">
            <img alt="Aerial view of a city with tall buildings, river, and bridges under daylight"
                class="w-full h-full object-cover brightness-[0.45]" height="900"
                src="https://storage.googleapis.com/a1aa/image/f2e15eca-698b-40c1-389a-11176b43a74d.jpg" width="1920" />
            <div class="absolute top-0 left-0 w-full h-full flex justify-center items-start pt-32 px-6 md:px-12 lg:px-20 xl:px-32">
  <div class="flex flex-row w-full max-w-6xl gap-8 justify-between">
   
    <div class="max-w-md md:max-w-lg text-white select-none">
      <h1 class="font-extrabold text-4xl md:text-5xl leading-tight md:leading-[3.5rem] tracking-tight"
          style="font-family: 'Montserrat', sans-serif">
          YOUR NEXT GREAT 
          <br />
          ADVENTURE AWAITS
      </h1>
      <p class="mt-6 text-xs md:text-sm max-w-xs md:max-w-sm leading-relaxed p-3">
          Dive into the unknown. We craft journeys that challenge your spirit, introduce you to fascinating cultures, and reveal landscapes that will leave you breathless.
      </p>
      <button class="bg-blue-600 text-white text-xs font-semibold rounded px-3 py-1 select-none" type="button">
          BOOK NOW
      </button>
    </div>

    <div id="result" class=" rounded-lg  w-full md:w-[350px] overflow-y-auto max-h-[500px] text-black">
      <!-- SERCH RESULT-->
    </div>

  </div>
</div>

            <div class="hidden md:block absolute top-1/3 left-6 h-24  opacity-50">
            </div>
            <div class="hidden md:flex flex-col space-y-6 absolute top-1/3 left-0 pl-2 text-white opacity-80">
                <a aria-label="Twitter" class="hover:text-teal-400" href="#">
                    <i class="fab fa-twitter fa-lg">
                    </i>
                </a>
                <a aria-label="Facebook" class="hover:text-teal-400" href="#">
                    <i class="fab fa-facebook-f fa-lg">
                    </i>
                </a>
                <a aria-label="Instagram" class="hover:text-teal-400" href="#">
                    <i class="fab fa-instagram fa-lg">
                    </i>
                </a>
                <a aria-label="YouTube" class="hover:text-teal-400" href="#">
                    <i class="fab fa-youtube fa-lg">
                    </i>
                </a>
            </div>
        </div>
    </main>

    <script src="travel_recommendation.js"></script>
</body>

</html>
