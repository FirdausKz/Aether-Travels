<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        Aether Travels - Contact Us
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans&amp;display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="relative min-h-screen bg-black">
    <header class="fixed top-0 left-0 w-full z-30 bg-black bg-opacity-50">
        <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-3">
            <div class="flex items-center space-x-2">
                <span class="logo-font text-white text-lg select-none font-semibold italic" style="font-family: 'Montserrat', sans-serif;">
                    Aether Travels
                </span>
            </div>
            <ul class="hidden md:flex space-x-8 text-white text-sm font-semibold">
                <li>
                    <a class="hover:underline" href="travel_recommendation.html">
                        Home
                    </a>
                </li>
                <li>
                    <a class="hover:underline" href="about_us.html">
                        About Us
                    </a>
                </li>
                <li>
                    <a class="hover:underline" href="contact_us.html">
                        Contact Us
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="pt-20">
        <div class="relative w-full min-h-[800px] md:min-h-[900px] lg:min-h-[950px] xl:min-h-[1000px]">
            <img alt="Aerial view of a city with tall buildings, river, and bridges under daylight, high definition"
                class="w-full h-full object-cover brightness-[0.45]" height="1080"
                src="https://storage.googleapis.com/a1aa/image/f2e15eca-698b-40c1-389a-11176b43a74d.jpg" width="1920" />
            <div
                class="absolute top-0 left-0 w-full h-full flex flex-col justify-start max-w-4xl mx-auto px-6 md:px-12 lg:px-20 xl:px-32 text-white pt-10 md:pt-16">
                <h1 class="font-extrabold text-3xl md:text-4xl leading-tight md:leading-[3rem] tracking-tight select-none font-montserrat mb-6"
                    style="font-family: 'Montserrat', sans-serif;">
                    CONTACT US
                </h1>
                <form class="bg-black bg-opacity-30 backdrop-blur-sm rounded p-5 max-w-md w-full space-y-5">
                    <div>
                        <label for="name" class="block text-xs md:text-sm font-semibold mb-1">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name"
                            class="w-full rounded px-3 py-2 text-black text-sm md:text-base outline-none" />
                    </div>
                    <div>
                        <label for="email" class="block text-xs md:text-sm font-semibold mb-1">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email"
                            class="w-full rounded px-3 py-2 text-black text-sm md:text-base outline-none" />
                    </div>
                    <div>
                        <label for="message" class="block text-xs md:text-sm font-semibold mb-1">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Your message"
                            class="w-full rounded px-3 py-2 text-black text-sm md:text-base outline-none resize-none"></textarea>
                    </div>
                    <button type="submit"
                        class="bg-teal-700 hover:bg-teal-800 text-white font-semibold text-sm md:text-base rounded px-6 py-2 transition">
                        Send Message
                    </button>
                </form>
            </div>
            <div class="hidden md:flex flex-col space-y-6 absolute top-1/3 left-0 pl-2 text-white opacity-80">
                <a aria-label="Twitter" class="hover:text-teal-400" href="#">
                    <i class="fab fa-twitter fa-lg"></i>
                </a>
                <a aria-label="Facebook" class="hover:text-teal-400" href="#">
                    <i class="fab fa-facebook-f fa-lg"></i>
                </a>
                <a aria-label="Instagram" class="hover:text-teal-400" href="#">
                    <i class="fab fa-instagram fa-lg"></i>
                </a>
                <a aria-label="YouTube" class="hover:text-teal-400" href="#">
                    <i class="fab fa-youtube fa-lg"></i>
                </a>
            </div>
        </div>
    </main>
    
</body>

</html>
